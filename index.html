<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Runner: Atak Arbuzów</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #f7f7f7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    user-select: none;
  }
  h1 {
    font-size: 18px;
    color: #535353;
    margin: 0;
    letter-spacing: 1px;
  }
  #gameCanvas {
    border: 1px solid #535353;
    background: #f7f7f7;
    display: block;
    touch-action: manipulation;
    image-rendering: pixelated;
  }
  #hint {
    color: #999;
    font-size: 13px;
    text-align: center;
    max-width: 600px;
  }
  #modeTag {
    font-weight: bold;
  }
  #credit {
    color: #bbb;
    font-size: 11px;
  }
  #credit a { color: #999; }
</style>
</head>
<body>
<div id="wrap">
  <h1>🦖 DINO RUNNER — <span id="modeTag">TRYB: KAKTUSY</span></h1>
  <canvas id="gameCanvas" width="600" height="150"></canvas>
  <div id="hint">SPACJA / STRZAŁKA W GÓRĘ = skok • STRZAŁKA W DÓŁ = kucnięcie • Po ~500 pkt kaktusy zamieniają się w kolczaste arbuzy!</div>
  <div id="credit">Sprite dinozaura/kaktusów/chmur pochodzi z Chromium (<a href="https://github.com/wayou/t-rex-runner" target="_blank" rel="noopener">wayou/t-rex-runner</a>), BSD-3-Clause, © 牛さん. Reszta gry: własna implementacja.</div>
</div>

<script>
(function () {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const W = canvas.width, H = canvas.height;
  const modeTag = document.getElementById('modeTag');

  const WATERMELON_SCORE_THRESHOLD = 500;

  let highScore = parseInt(localStorage.getItem('dinoWatermelonHighScore') || '0', 10);

  // ---- Sprite sheet (original Chrome offline-dino sprite, see credit line) ----
  const sprite = new Image();
  let spriteLoaded = false;
  sprite.onload = () => { spriteLoaded = true; };
  sprite.src = 'assets/trex-sprite-1x.png';

  const SPR = {
    RESTART:     { x: 2,   y: 2,  w: 36,  h: 32 },
    CLOUD:       { x: 86,  y: 2,  w: 46,  h: 14 },
    PTERODACTYL: { x: 134, y: 2,  w: 46,  h: 40 },
    CACTUS_SMALL:{ x: 228, y: 2,  w: 17,  h: 35 },
    CACTUS_LARGE:{ x: 332, y: 2,  w: 25,  h: 50 },
    TEXT:        { x: 484, y: 2 },          // digits 0-9 strip (10px each) + GAME OVER text below
    TREX:        { x: 678, y: 2 }
  };
  const DIGIT_W = 10, DIGIT_H = 13, DIGIT_DEST_W = 11;
  const GAME_OVER_TEXT = { x: SPR.TEXT.x, y: SPR.TEXT.y + 13, w: 191, h: 11 };
  const TREX_W = 44, TREX_H = 47, TREX_W_DUCK = 59;
  const TREX_FRAME = {
    waiting: [44, 0],
    running: [88, 132],
    jumping: [0],
    crashed: [220],
    ducking: [264, 323]
  };

  const GROUND_BASELINE = H - 10; // 140 — bottom of dino / obstacles

  let dino, obstacles, clouds, score, speed, spawnTimer, running, gameOverFlag, watermelonMode, frame;

  function resetGame() {
    dino = {
      x: 40,
      y: GROUND_BASELINE - TREX_H,
      vy: 0,
      jumping: false,
      ducking: false,
      groundY: GROUND_BASELINE - TREX_H
    };
    obstacles = [];
    clouds = [];
    for (let i = 0; i < 3; i++) {
      clouds.push({ x: Math.random() * W, y: 15 + Math.random() * 40 });
    }
    score = 0;
    speed = 6;
    spawnTimer = 60;
    running = true;
    gameOverFlag = false;
    watermelonMode = false;
    frame = 0;
    modeTag.textContent = 'TRYB: KAKTUSY';
  }

  const GRAVITY = 0.9;
  const JUMP_VELOCITY = -14.5;

  function jump() {
    if (!dino.jumping && running) {
      dino.vy = JUMP_VELOCITY;
      dino.jumping = true;
    }
  }

  function setDuck(v) {
    if (!running) return;
    dino.ducking = v && !dino.jumping;
  }

  function spawnObstacle() {
    const isBird = watermelonMode ? Math.random() < 0.25 : Math.random() < 0.2;
    if (isBird) {
      obstacles.push({
        type: 'bird',
        x: W + 20,
        y: [GROUND_BASELINE - 90, GROUND_BASELINE - 60, GROUND_BASELINE - 40][Math.floor(Math.random() * 3)],
        w: SPR.PTERODACTYL.w,
        h: SPR.PTERODACTYL.h,
        frame: 0
      });
    } else if (watermelonMode) {
      const size = 34 + Math.random() * 12;
      obstacles.push({
        type: 'watermelon',
        x: W + 20,
        y: GROUND_BASELINE - size,
        w: size,
        h: size
      });
    } else {
      const large = Math.random() < 0.5;
      const clusters = Math.random() < 0.3 ? 2 : 1;
      let ox = W + 20;
      const def = large ? SPR.CACTUS_LARGE : SPR.CACTUS_SMALL;
      for (let i = 0; i < clusters; i++) {
        obstacles.push({
          type: 'cactus',
          large,
          x: ox,
          y: GROUND_BASELINE - def.h,
          w: def.w,
          h: def.h
        });
        ox += def.w + 6;
      }
    }
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
  }

  function update() {
    frame++;
    score += 0.12;
    if (Math.floor(score) % 100 === 0) {
      speed = 6 + Math.floor(score / 150) * 0.6;
    }

    if (!watermelonMode && score >= WATERMELON_SCORE_THRESHOLD) {
      watermelonMode = true;
      obstacles = obstacles.filter(o => o.type !== 'cactus');
      modeTag.textContent = 'TRYB: KOLCZASTE ARBUZY 🍉';
    }

    dino.vy += GRAVITY;
    dino.y += dino.vy;
    if (dino.y >= dino.groundY) {
      dino.y = dino.groundY;
      dino.vy = 0;
      dino.jumping = false;
    }

    clouds.forEach(c => {
      c.x -= speed * 0.2;
      if (c.x < -SPR.CLOUD.w) { c.x = W + Math.random() * 100; c.y = 15 + Math.random() * 40; }
    });

    spawnTimer -= 1;
    if (spawnTimer <= 0) {
      spawnObstacle();
      spawnTimer = 55 + Math.random() * 55 - Math.min(speed * 3, 40);
      if (spawnTimer < 30) spawnTimer = 30;
    }

    obstacles.forEach(o => {
      o.x -= speed;
      if (o.type === 'bird' && frame % 8 === 0) o.frame = 1 - o.frame;
    });
    obstacles = obstacles.filter(o => o.x + o.w > -10);

    const duckH = 25;
    const dinoBox = {
      x: dino.x + 6,
      y: dino.ducking ? (GROUND_BASELINE - duckH) + 4 : dino.y + 4,
      w: (dino.ducking ? TREX_W_DUCK : TREX_W) - 12,
      h: (dino.ducking ? duckH : TREX_H) - 8
    };

    for (const o of obstacles) {
      const obox = { x: o.x + 3, y: o.y + 3, w: o.w - 6, h: o.h - 6 };
      if (rectsOverlap(dinoBox, obox)) {
        endGame();
        break;
      }
    }
  }

  function endGame() {
    running = false;
    gameOverFlag = true;
    const finalScore = Math.floor(score);
    if (finalScore > highScore) {
      highScore = finalScore;
      localStorage.setItem('dinoWatermelonHighScore', String(highScore));
    }
  }

  // ---- Drawing ----
  function drawClouds() {
    clouds.forEach(c => {
      ctx.drawImage(sprite, SPR.CLOUD.x, SPR.CLOUD.y, SPR.CLOUD.w, SPR.CLOUD.h, Math.round(c.x), Math.round(c.y), SPR.CLOUD.w, SPR.CLOUD.h);
    });
  }

  function drawGround() {
    ctx.strokeStyle = '#535353';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_BASELINE + 2);
    ctx.lineTo(W, GROUND_BASELINE + 2);
    ctx.stroke();
  }

  function drawDino() {
    let sx, sy, sw, sh, dx, dy, dw, dh;
    sy = SPR.TREX.y;
    if (gameOverFlag) {
      sx = SPR.TREX.x + TREX_FRAME.crashed[0];
      sw = TREX_W; sh = TREX_H;
      dx = dino.x; dy = dino.groundY; dw = TREX_W; dh = TREX_H;
    } else if (dino.jumping) {
      sx = SPR.TREX.x + TREX_FRAME.jumping[0];
      sw = TREX_W; sh = TREX_H;
      dx = dino.x; dy = dino.y; dw = TREX_W; dh = TREX_H;
    } else if (dino.ducking) {
      const f = TREX_FRAME.ducking[Math.floor(frame / 8) % 2];
      sx = SPR.TREX.x + f;
      sw = TREX_W_DUCK; sh = TREX_H;
      dx = dino.x; dy = GROUND_BASELINE - 25; dw = TREX_W_DUCK; dh = 25;
    } else if (running) {
      const f = TREX_FRAME.running[Math.floor(frame / 6) % 2];
      sx = SPR.TREX.x + f;
      sw = TREX_W; sh = TREX_H;
      dx = dino.x; dy = dino.y; dw = TREX_W; dh = TREX_H;
    } else {
      const f = TREX_FRAME.waiting[Math.floor(frame / 20) % 2];
      sx = SPR.TREX.x + f;
      sw = TREX_W; sh = TREX_H;
      dx = dino.x; dy = dino.y; dw = TREX_W; dh = TREX_H;
    }
    ctx.drawImage(sprite, sx, sy, sw, sh, Math.round(dx), Math.round(dy), dw, dh);
  }

  function drawCactus(o) {
    const def = o.large ? SPR.CACTUS_LARGE : SPR.CACTUS_SMALL;
    ctx.drawImage(sprite, def.x, def.y, def.w, def.h, Math.round(o.x), Math.round(o.y), o.w, o.h);
  }

  function drawBird(o) {
    const fx = SPR.PTERODACTYL.x + o.frame * SPR.PTERODACTYL.w;
    ctx.drawImage(sprite, fx, SPR.PTERODACTYL.y, SPR.PTERODACTYL.w, SPR.PTERODACTYL.h, Math.round(o.x), Math.round(o.y), o.w, o.h);
  }

  function drawWatermelon(o) {
    const cx = o.x + o.w / 2, cy = o.y + o.h / 2, r = o.w / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = '#2c6e2c';
    const spikeCount = 10;
    for (let i = 0; i < spikeCount; i++) {
      const ang = (i / spikeCount) * Math.PI * 2;
      const baseA = ang - 0.15, baseB = ang + 0.15;
      ctx.beginPath();
      ctx.moveTo(Math.cos(baseA) * r * 0.85, Math.sin(baseA) * r * 0.85);
      ctx.lineTo(Math.cos(ang) * r * 1.5, Math.sin(ang) * r * 1.5);
      ctx.lineTo(Math.cos(baseB) * r * 0.85, Math.sin(baseB) * r * 0.85);
      ctx.closePath();
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.9, 0, Math.PI * 2);
    ctx.fillStyle = '#3f9142';
    ctx.fill();
    ctx.strokeStyle = '#2c6e2c';
    ctx.lineWidth = 2;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * (r * 0.28), -r * 0.8);
      ctx.quadraticCurveTo(i * (r * 0.28) + (i * 4), 0, i * (r * 0.28), r * 0.8);
      ctx.stroke();
    }
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.moveTo(-r * 0.35, -r * 0.15);
    ctx.lineTo(-r * 0.05, -r * 0.05);
    ctx.lineTo(-r * 0.35, r * 0.05);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r * 0.35, -r * 0.15);
    ctx.lineTo(r * 0.05, -r * 0.05);
    ctx.lineTo(r * 0.35, r * 0.05);
    ctx.fill();
    ctx.restore();
  }

  function drawObstacles() {
    obstacles.forEach(o => {
      if (o.type === 'cactus') drawCactus(o);
      else if (o.type === 'watermelon') drawWatermelon(o);
      else if (o.type === 'bird') drawBird(o);
    });
  }

  function drawDigits(value, digits, targetX, targetY) {
    const str = String(value).padStart(digits, '0');
    for (let i = 0; i < str.length; i++) {
      const d = parseInt(str[i], 10);
      ctx.drawImage(sprite, SPR.TEXT.x + d * DIGIT_W, SPR.TEXT.y, DIGIT_W, DIGIT_H,
        targetX + i * DIGIT_DEST_W, targetY, DIGIT_W, DIGIT_H);
    }
  }

  function drawScore() {
    const scoreX = W - 12 - 5 * DIGIT_DEST_W;
    drawDigits(Math.floor(score), 5, scoreX, 10);
    const hiDigitsX = scoreX - 20 - 5 * DIGIT_DEST_W;
    drawDigits(highScore, 5, hiDigitsX, 10);
    ctx.fillStyle = '#535353';
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.fillText('HI', hiDigitsX - 6, 21);
    ctx.textAlign = 'left';
  }

  function drawGameOver() {
    const centerX = W / 2;
    const textX = Math.round(centerX - GAME_OVER_TEXT.w / 2);
    const textY = Math.round((H - 25) / 3);
    ctx.drawImage(sprite, GAME_OVER_TEXT.x, GAME_OVER_TEXT.y, GAME_OVER_TEXT.w, GAME_OVER_TEXT.h,
      textX, textY, GAME_OVER_TEXT.w, GAME_OVER_TEXT.h);
    const restartX = Math.round(centerX - SPR.RESTART.w / 2);
    const restartY = Math.round(H / 2);
    ctx.drawImage(sprite, SPR.RESTART.x, SPR.RESTART.y, SPR.RESTART.w, SPR.RESTART.h,
      restartX, restartY, SPR.RESTART.w, SPR.RESTART.h);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (!spriteLoaded) return;
    drawClouds();
    drawGround();
    drawObstacles();
    drawDino();
    drawScore();
    if (gameOverFlag) drawGameOver();
  }

  const STEP_MS = 1000 / 60;
  const MAX_DELTA_MS = 250; // avoid spiral of death after tab is backgrounded
  let lastTime = 0;
  let accumulator = 0;

  function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let delta = timestamp - lastTime;
    lastTime = timestamp;
    if (delta > MAX_DELTA_MS) delta = MAX_DELTA_MS;
    accumulator += delta;
    while (accumulator >= STEP_MS) {
      if (running) update();
      accumulator -= STEP_MS;
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---- Input ----
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (!running && gameOverFlag) {
        resetGame();
      } else {
        jump();
      }
    } else if (e.code === 'ArrowDown') {
      e.preventDefault();
      setDuck(true);
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowDown') setDuck(false);
  });

  canvas.addEventListener('pointerdown', () => {
    if (!running && gameOverFlag) {
      resetGame();
    } else {
      jump();
    }
  });

  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
